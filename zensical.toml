# Leerhandboek Hack The Future 2026, team de-rubberen-badeendjes.
# Lokaal bekijken:  uvx zensical serve      (of: pip install zensical && zensical serve)
# Statische site:   uvx zensical build      -> map site/ (staat in .gitignore)

[project]
site_url = "https://vr0em.github.io/htf-antwerpen-2026/"
site_name = "Four Seals of the Broken Realm"
site_description = "Wat we deden op Hack The Future 2026 (challenge 107, FlowFactor), en wat je eruit kunt leren."
site_author = "VR0EM & wimmevdv"
docs_dir = "docs"
nav = [
  { "Start" = "index.md" },
  { "De opdracht" = "opdracht.md" },
  { "Denkwijze" = "denkwijze.md" },
  { "Stappenplan" = [
    { "Overzicht" = "stappenplan/index.md" },
    { "0. Voorbereiding" = "stappenplan/0-voorbereiding.md" },
    { "1. Level 1: drift" = "stappenplan/1-level-1.md" },
    { "2. Level 2: gelekte sleutel" = "stappenplan/2-level-2.md" },
    { "3. Level 3: corrupte agent" = "stappenplan/3-level-3.md" },
    { "4. Level 4: tijdsbom" = "stappenplan/4-level-4.md" },
    { "5. Pipeline en zelfherstel" = "stappenplan/5-pipeline.md" },
    { "6. Bewijs en pitch" = "stappenplan/6-bewijs-en-pitch.md" },
  ] },
  { "Samenwerken met 2 agents" = "samenwerking.md" },
  { "De omgeving" = "omgeving.md" },
  { "Architectuur" = "architectuur.md" },
  { "Levels" = [
    { "Level 1: Drift" = "levels/level-1.md" },
    { "Level 1: drift-rapport" = "bewijs/level-1/drift-rapport.md" },
    { "Level 2: Gelekte sleutel" = "levels/level-2.md" },
    { "Level 3: Corrupte agent" = "levels/level-3.md" },
    { "Level 4: Tijdsbom in de MCP-server" = "levels/level-4.md" },
  ] },
  { "Logboek" = "logboek.md" },
  { "Pitch" = "pitch.md" },
  { "Woordenlijst" = "woordenlijst.md" },
  { "Contract" = "contract.md" },
]

[project.theme]
language = "nl"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Donkere modus"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Lichte modus"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true

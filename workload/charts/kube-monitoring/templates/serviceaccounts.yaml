# Used by the metrics collector (monitoring.yaml).
#
# Token rotation (Level 2, #6): the name comes from values.yaml. Changing it makes
# Helm create a new ServiceAccount and delete the old one, and deleting a
# ServiceAccount invalidates every token ever issued for it (bound tokens are tied
# to its UID). The compromised account `metrics-collector` was rotated this way.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.monitoring.serviceAccount }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: monitoring
    {{- include "km.labels" . | nindent 4 }}
